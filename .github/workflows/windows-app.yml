name: Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build WorkCRM.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name WorkCRM crm.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: WorkCRM-windows
          path: dist/WorkCRM.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WorkCRM.exe
          generate_release_notes: true
